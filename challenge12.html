<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cssbattle</title>
    <style>
      body {
        background-color: #eed9d9;
        margin: 0;
      }
      .outline {
        border: 30px solid #668884;
        height: 80%;
      }
      .outline > div {
        background-color: #668884;
        height: 40px;
      }
      .box1 {
        width: 86px;
        margin-left: 21px;
      }
      .box2 {
        width: 162px;
        margin-left: 34px;
      }
      .box3 {
        width: 196px;
        margin-left: 55px;
      }
      .box4 {
        width: 196px;
        margin-left: 89px;
      }
      .box5 {
        width: 162px;
        margin-left: 144px;
      }
      .box6 {
        width: 86px;
        margin-left: 233px;
      }
    </style>
  </head>
  <body>
    <div class="outline">
      <div class="box1"></div>
      <div class="box2"></div>
      <div class="box3"></div>
      <div class="box4"></div>
      <div class="box5"></div>
      <div class="box6"></div>
    </div>
  </body>
