<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cssbattle</title>
    <style>
      body {
        background-color: #2f5a76;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        --size: 120px;
      }
      .container {
        width: 400px;
        height: 300px;
        background-color: #2f5a76;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: -11;
      }
      .horizontal-bar {
        width: 360px;
        height: 60px;
        background-color: #f3ac3c;
        z-index: 11;
      }
      .vertical-bar {
        width: 120px;
        height: 190px;
        background-color: #2f5a76;
        position: absolute;
        border: 20px solid #f3ac3c;
        left: 30%;
        top: 35px;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="horizontal-bar"></div>
      <div class="vertical-bar"></div>
    </div>
  </body>

</html>
