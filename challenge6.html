<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cssbattle</title>
    <style>
      body {
        background-color: #b8f4a6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .circle {
        width: 200px;
        height: 200px;
        background-color: #3ba44d;
        border-radius: 50%;
      }
      .bar {
        width: 210px;
        height: 50px;
        background-color: #b8f4a6;
        position: absolute;
      }
      .vartical {
        transform: rotate(90deg);
      }
    </style>
  </head>
  <body>
    <div class="circle"></div>
    <div class="bar"></div>
    <div class="bar vartical"></div>
  </body>
  <!-- https://cssbattle.dev/play/iRZKUPicHAnO63dDKBeV -->
</html>
